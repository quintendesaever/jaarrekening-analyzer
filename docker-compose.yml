services:
  app:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      RATIOS_CONFIG_PATH: /data/ratios.yaml
      TABLES_CONFIG_PATH: /data/tables.yaml
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      - ratios-data:/data
    expose:
      - "8000"

  caddy:
    build:
      context: .
      target: caddy
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://caddy:80
    depends_on:
      - caddy

volumes:
  ratios-data:
