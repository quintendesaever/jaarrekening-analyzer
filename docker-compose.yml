services:
  app:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      RATIOS_CONFIG_PATH: /data/ratios.yaml
      TABLES_CONFIG_PATH: /data/tables.yaml
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      - ratios-data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    build:
      context: .
      target: caddy
    restart: unless-stopped
    # Host localhost only — not LAN. Tunnel reaches Caddy via Docker DNS (caddy:80).
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      app:
        condition: service_healthy

  # Opt-in public Quick Tunnel (*.trycloudflare.com). Not started by default.
  # Enable: docker compose --profile tunnel up -d
  cloudflared:
    profiles:
      - tunnel
    # Pin concrete release + multi-arch manifest digest (not :latest).
    image: cloudflare/cloudflared:2026.9.0@sha256:ff69a2225ad7c6f85ed84fbd5f3087df46202426b2388ec60214098e0adf05e9
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://caddy:80
    depends_on:
      caddy:
        condition: service_started

volumes:
  ratios-data:
