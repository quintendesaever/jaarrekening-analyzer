# Publish-only — SHA tags for app + caddy (never :main from this workflow).
name: Publish image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  APP_IMAGE: ghcr.io/quintendesaever/jaarrekening-analyzer
  CADDY_IMAGE: ghcr.io/quintendesaever/jaarrekening-analyzer-caddy

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          SHA="$(echo -n "${GITHUB_SHA}" | tr '[:upper:]' '[:lower:]')"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push SHA tags
        run: |
          set -euo pipefail
          SHA="${{ steps.meta.outputs.sha }}"
          docker buildx build --target backend \
            -t "${APP_IMAGE}:${SHA}" \
            --label "org.opencontainers.image.revision=${SHA}" \
            --push .
          docker buildx build --target caddy \
            -t "${CADDY_IMAGE}:${SHA}" \
            --label "org.opencontainers.image.revision=${SHA}" \
            --push .
          echo "Published ${APP_IMAGE}:${SHA} and ${CADDY_IMAGE}:${SHA}"
